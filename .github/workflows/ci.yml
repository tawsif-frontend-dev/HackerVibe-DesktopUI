name: Windows checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Python syntax and package tests
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v
      - name: Parse PowerShell installer and check defaults
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @('install.ps1', 'uninstall.ps1')) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
          if (-not (Select-String -Path 'Skins/HackerSuite/@Resources/Settings.inc' -SimpleMatch 'WeatherAuto=0' -Quiet)) { throw 'IP-based weather lookup must remain opt-in by default' }
